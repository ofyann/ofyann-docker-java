name: Docker Build and Push

on:
  schedule:
    # 每周一 UTC 00:00 全量多架构构建（JDK 更新频率低，每周足够；避免每日 16×3 QEMU 构建撑爆免费额度）
    - cron: '0 0 * * 1'
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker-build.yml'
      - 'build.sh'
  workflow_dispatch:
    inputs:
      force_build:
        description: '强制重新构建所有版本'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY_DOCKERHUB: docker.io
  IMAGE_NAME: ofyann/java

jobs:
  # 第一步：获取所有版本的最新版本号（用于打具体版本标签）
  fetch-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.fetch.outputs.matrix }}

    steps:
      - name: Fetch latest versions from Adoptium API
        id: fetch
        run: |
          # 定义需要的 Java 大版本
          JAVA_VERSIONS="8 17 21 25"

          echo "正在获取版本信息..."
          MATRIX_JSON='{"include":[]}'

          for version in $JAVA_VERSIONS; do
            echo "检查 Java $version..."

            # 版本号与架构无关，统一用 x64 查询即可
            API_URL="https://api.adoptium.net/v3/assets/latest/${version}/hotspot?image_type=jdk&os=linux&architecture=x64"
            RESPONSE=$(curl -s "$API_URL")

            if [ -z "$RESPONSE" ] || [ "$RESPONSE" = "[]" ]; then
              echo "警告: Java $version 暂无可用版本"
              continue
            fi

            # 解析版本信息
            VERSION_OBJ=$(echo "$RESPONSE" | jq -r '.[0].version')
            SEMVER=$(echo "$VERSION_OBJ" | jq -r '.semver')
            OPENJDK_VERSION=$(echo "$VERSION_OBJ" | jq -r '.openjdk_version')

            # 构建具体版本标签
            if [ "$version" = "8" ]; then
              # Java 8: openjdk_version "1.8.0_492-b09" -> 8u492b09
              SECURITY=$(echo "$OPENJDK_VERSION" | sed -n 's/.*_\([0-9]*\).*/\1/p')
              BUILD=$(echo "$OPENJDK_VERSION" | sed -n 's/.*-\(b[0-9]*\).*/\1/p')

              if [ -n "$SECURITY" ] && [ -n "$BUILD" ]; then
                FULL_VERSION="8u${SECURITY}${BUILD}"
              else
                echo "无法解析 Java 8 版本号: $OPENJDK_VERSION"
                continue
              fi
            else
              # Java 11+: semver "17.0.19+10" 或 "21.0.9+10.0.LTS" -> 17.0.19_10
              CLEAN_SEMVER=$(echo "$SEMVER" | sed 's/\.0\.LTS$//' | sed 's/-LTS$//')
              UPDATE=$(echo "$CLEAN_SEMVER" | sed -n 's/^\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p')
              BUILD=$(echo "$CLEAN_SEMVER" | sed -n 's/.*+\([0-9]*\).*/\1/p')

              if [ -n "$UPDATE" ] && [ -n "$BUILD" ]; then
                FULL_VERSION="${UPDATE}_${BUILD}"
              else
                echo "无法解析 Java ${version} 版本号: $SEMVER"
                continue
              fi
            fi

            echo "  版本: $FULL_VERSION"

            # 添加到 matrix - 为每个版本创建两个条目（完整版和精简版）
            # 标签遵循命名规则：ofyann/java:<distro>-<version>[-<variant>]
            # 下载直链与 SHA256 由 Dockerfile 按 TARGETARCH 自行从 API 获取，matrix 无需携带
            DISTRO="temurin"
            MATRIX_JSON=$(echo "$MATRIX_JSON" | jq \
              --arg distro "$DISTRO" \
              --arg major "$version" \
              --arg full "$FULL_VERSION" \
              '.include += [{
                "distro": $distro,
                "java_major": $major,
                "full_version": $full,
                "variant": "full",
                "variant_suffix": ""
              }]' | jq \
              --arg distro "$DISTRO" \
              --arg major "$version" \
              --arg full "$FULL_VERSION" \
              '.include += [{
                "distro": $distro,
                "java_major": $major,
                "full_version": $full,
                "variant": "minimal",
                "variant_suffix": "-minimal"
              }]')
          done

          echo "生成的 matrix:"
          echo "$MATRIX_JSON" | jq .

          # 输出 matrix（压缩为单行）
          MATRIX_COMPACT=$(echo "$MATRIX_JSON" | jq -c .)
          echo "matrix=$MATRIX_COMPACT" >> $GITHUB_OUTPUT

  # 第二步：多架构构建和推送 Docker 镜像
  build-and-push:
    needs: fetch-versions
    runs-on: ubuntu-latest
    if: needs.fetch-versions.outputs.matrix != '' && needs.fetch-versions.outputs.matrix != '{"include":[]}'

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.fetch-versions.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 多架构构建需要 QEMU 仿真 arm64 / arm
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check if image exists
        id: check
        continue-on-error: true
        run: |
          # 检查具体版本的镜像（多架构 manifest list）是否已存在
          # 标签格式：<distro>-<full_version><variant_suffix>
          TAG="${{ matrix.distro }}-${{ matrix.full_version }}${{ matrix.variant_suffix }}"
          if docker manifest inspect ${{ env.IMAGE_NAME }}:${TAG} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "镜像 ${TAG} 已存在"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "镜像 ${TAG} 不存在，需要构建"
          fi

      - name: Prepare build metadata
        id: meta
        if: steps.check.outputs.exists != 'true' || github.event.inputs.force_build == 'true'
        run: |
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build and push multi-arch Docker image
        # push 事件：代码改动必验证（忽略 exists 跳过）；schedule/dispatch：仅新版本构建
        if: github.event_name == 'push' || steps.check.outputs.exists != 'true' || github.event.inputs.force_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # 完整版/精简版由同一 Dockerfile 的不同 target 实现
          target: ${{ matrix.variant }}
          # push 事件仅 amd64 构建验证不推送（快速反馈、不耗 QEMU、不污染镜像仓库）；
          # schedule/dispatch 全架构构建并推送
          platforms: ${{ github.event_name == 'push' && 'linux/amd64' || 'linux/amd64,linux/arm64,linux/arm' }}
          push: ${{ github.event_name != 'push' }}
          load: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ matrix.distro }}-${{ matrix.java_major }}${{ matrix.variant_suffix }}
            ${{ env.IMAGE_NAME }}:${{ matrix.distro }}-${{ matrix.full_version }}${{ matrix.variant_suffix }}
          build-args: |
            JAVA_MAJOR=${{ matrix.java_major }}
            JAVA_VERSION=${{ matrix.java_major }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.distro }}-${{ matrix.java_major }}-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.distro }}-${{ matrix.java_major }}-${{ matrix.variant }}

      - name: Test image (amd64)
        if: github.event_name == 'push' || steps.check.outputs.exists != 'true' || github.event.inputs.force_build == 'true'
        run: |
          set -e
          TAG="${{ matrix.distro }}-${{ matrix.full_version }}${{ matrix.variant_suffix }}"
          IMG="${{ env.IMAGE_NAME }}:${TAG}"
          echo "测试镜像: $IMG (amd64)"
          docker run --rm --platform linux/amd64 $IMG java -version
          docker run --rm --platform linux/amd64 $IMG javac -version

          # 时区断言：默认 Asia/Shanghai (+0800)
          echo "--- 时区测试 ---"
          docker run --rm --platform linux/amd64 $IMG sh -c 'echo "date +%Z=$(date +%Z) date +%z=$(date +%z)"'
          TZ_OFFSET=$(docker run --rm --platform linux/amd64 $IMG date +%z)
          if [ "$TZ_OFFSET" != "+0800" ]; then
            echo "::error::系统时区异常: date +%z=$TZ_OFFSET (期望 +0800)"
            exit 1
          fi
          # Java 层面时区断言：解析 ZonedDateTime 输出末尾的 +08:00
          JAVA_TZ=$(docker run --rm --platform linux/amd64 $IMG sh -c \
            'printf "%s\n" "import java.time.ZonedDateTime;" "public class T{public static void main(String[]a){System.out.println(ZonedDateTime.now());}}" > /tmp/T.java && cd /tmp && javac T.java && java T')
          echo "Java ZonedDateTime.now() = $JAVA_TZ"
          echo "$JAVA_TZ" | grep -q '+08:00' || { echo "::error::Java 时区异常: $JAVA_TZ (期望含 +08:00)"; exit 1; }

          # locale 断言
          echo "--- locale 测试 ---"
          docker run --rm --platform linux/amd64 $IMG sh -c 'locale 2>/dev/null | grep -E "^(LANG|LC_ALL)=" '
          docker run --rm --platform linux/amd64 $IMG sh -c 'locale -a | grep -qi "^en_US\.utf" && echo "en_US.UTF-8 已生成 ✓" || { echo "::error::en_US.UTF-8 locale 未生成"; exit 1; }'
          # UTF-8 编码确保中文显示（en_US.UTF-8 足够，与 locale 数量无关）
          ZH=$(docker run --rm --platform linux/amd64 $IMG sh -c "printf '你好世界'")
          echo "中文输出测试: [$ZH]"

          echo "✓ 测试通过"
          echo "注: arm64 / arm 架构依赖 QEMU 仿真运行较慢，仅验证构建成功，不单独运行测试"

      - name: Update version info
        if: github.event_name == 'push' || steps.check.outputs.exists != 'true' || github.event.inputs.force_build == 'true'
        run: |
          VARIANT_NAME="${{ matrix.variant == 'minimal' && '精简版' || '完整版' }}"
          echo "${{ matrix.distro }} Java ${{ matrix.java_major }} ${VARIANT_NAME} - ${{ matrix.full_version }}${{ matrix.variant_suffix }} 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "镜像标签:" >> $GITHUB_STEP_SUMMARY
          echo "  - ${{ env.IMAGE_NAME }}:${{ matrix.distro }}-${{ matrix.java_major }}${{ matrix.variant_suffix }}" >> $GITHUB_STEP_SUMMARY
          echo "  - ${{ env.IMAGE_NAME }}:${{ matrix.distro }}-${{ matrix.full_version }}${{ matrix.variant_suffix }}" >> $GITHUB_STEP_SUMMARY
          echo "架构: linux/amd64, linux/arm64, linux/arm" >> $GITHUB_STEP_SUMMARY

  # 第三步：生成构建报告
  report:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Generate report
        run: |
          echo "## 构建报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "构建时间: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "触发方式: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "支持的 Java 版本: 8, 17, 21, 25" >> $GITHUB_STEP_SUMMARY
          echo "发行版: temurin（当前）" >> $GITHUB_STEP_SUMMARY
          echo "镜像仓库: ${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "目标架构: linux/amd64, linux/arm64, linux/arm" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "每个 Java 版本构建两个多架构镜像（标签格式 <distro>-<version>[-<variant>]）:" >> $GITHUB_STEP_SUMMARY
          echo "  - 完整版（带 Arthas）: \`ofyann/java:temurin-17\`" >> $GITHUB_STEP_SUMMARY
          echo "  - 精简版（纯运行时）: \`ofyann/java:temurin-17-minimal\`" >> $GITHUB_STEP_SUMMARY
